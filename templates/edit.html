<style>
    .post-container{
        width: 600px;
        margin: 50px auto;
        padding: 30px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(0,0,0,0.15);
    }

    .post-container h1{
        text-align: center;
        margin-bottom: 30px;
    }

    .form-group{
        margin-bottom: 20px;
    }

    .form-group label{
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }

    .form-control{
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
    }

    .btn{
        display: block;
        margin: 20px auto;
        padding: 10px 25px;
        cursor: pointer;
    }
</style>

<div class="post-container">

    <h1>Add/Edit Posts</h1>

    <form name="sentMessage" id="contactForm" method="POST" novalidate>

        <div class="form-group">
            <label>Title</label>
            <input type="text"
                   class="form-control"
                   placeholder="Title"
                   id="title"
                   name="title"
                   value="{{ post.title if post else '' }}"
                   required>
        </div>

        <div class="form-group">
            <label>Tagline</label>
            <input type="text"
                   class="form-control"
                   placeholder="Tagline"
                   id="tagline"
                   name="tagline"
                   value="{{ post.tagline if post else '' }}"
                   required>
        </div>

        <div class="form-group">
            <label>Slug</label>
            <input type="text"
                   class="form-control"
                   placeholder="Slug"
                   id="slug"
                   name="slug"
                   value="{{ post.slug if post else '' }}"
                   required>
        </div>

        <div class="form-group">
            <label>Content</label>
            <textarea rows="8"
                      class="form-control"
                      placeholder="Content"
                      name="content"
                      id="content"
                      required>{{ post.content if post else '' }}</textarea>
        </div>

        <button type="submit" class="btn btn-primary" id="sendMessageButton">
            Save Post
        </button>

    </form>

</div>
