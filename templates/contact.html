{% extends "layout.html" %}

{% block body %}

<!-- Page Header -->

<header class="masthead" style="background-image: url('{{ url_for('static', filename='img/contacts.png') }}')">

```
<div class="overlay"></div>

<div class="container">

    <div class="row">

        <div class="col-lg-8 col-md-10 mx-auto">

            <div class="page-heading">

                <span class="subheading">
                    Got an opportunity, project, or idea?
                </span>

                <h1>
                <h1> Let's Connect </h1>

                <span class="subheading">
                    and make it happen!
                </span>




            </div>

        </div>

    </div>

</div>
```

</header>

<!-- Main Content -->

<div class="container">

```
<div class="row">

    <div class="col-lg-8 col-md-10 mx-auto">

        <p>
            Want to get in touch? Fill out the form below to send me a message
            and I will get back to you as soon as possible!
        </p>

        <form name="sentMessage"
              id="contactForm"
              action="/contact"
              method="post"
              novalidate>

            <div class="control-group">

                <div class="form-group floating-label-form-group controls">

                    <label>Name</label>

                    <input type="text"
                           class="form-control"
                           placeholder=""
                           id="name"
                           name="name"
                           required>

                    <p class="help-block text-danger"></p>

                </div>

            </div>

            <div class="control-group">

                <div class="form-group floating-label-form-group controls">

                    <label>Email Address</label>

                    <input type="email"
                           class="form-control"
                           placeholder=""
                           id="email"
                           name="email"
                           required>

                    <p class="help-block text-danger"></p>

                </div>

            </div>

            <div class="control-group">

                <div class="form-group col-xs-12 floating-label-form-group controls">

                    <label>Phone Number</label>

                    <input type="tel"
                           class="form-control"
                           placeholder=""
                           id="phone"
                           name="phone"
                           required>

                    <p class="help-block text-danger"></p>

                </div>

            </div>

            <div class="control-group">

                <div class="form-group floating-label-form-group controls">

                    <label>Message</label>

                    <textarea rows="5"
                              class="form-control"
                              placeholder=""
                              id="message"
                              name="message"
                              required></textarea>

                    <p class="help-block text-danger"></p>

                </div>

            </div>

            <br>

            <div id="success"></div>

            <div class="form-group">

                <button type="submit"
                        class="btn btn-primary"
                        id="sendMessageButton">

                    Send

                </button>

            </div>

        </form>

    </div>

</div>
```

</div>

{% endblock %}
