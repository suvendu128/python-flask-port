<!doctype html>

<html lang="en">

<head>

```
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Admin Login | SuvenduLab</title>

<link rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">

<style>

    body{
        margin:0;
        padding:0;
        min-height:100vh;

        background-image:url("{{ url_for('static', filename='img/login.png') }}");
        background-size:cover;
        background-position:center;
        background-repeat:no-repeat;

        display:flex;
        justify-content:center;
        align-items:center;
    }

    .login-box{

        width:800px;

        background:rgba(15,23,42,0.85);

        backdrop-filter:blur(10px);

        border-radius:20px;

        padding:40px;

        box-shadow:0 10px 40px rgba(0,0,0,0.5);

        color:white;
    }

    .login-title{
        text-align:center;
        color:#00e5ff;
        margin-bottom:25px;
        font-weight:bold;
    }

    .form-control{
        background:#1e293b;
        border:none;
        color:white;
    }

    .form-control:focus{
        background:#334155;
        color:white;
        box-shadow:none;
    }

    .btn-login{
        background:#00e5ff;
        border:none;
        color:black;
        font-weight:bold;
    }

    .btn-login:hover{
        background:#38bdf8;
    }

    .footer-text{
        text-align:center;
        margin-top:20px;
        color:#cbd5e1;
    }

</style>
```

</head>

<body>

```
<div class="login-box">

    <h2 class="login-title">
          Admin Login
    </h2>

    <form action="/dashboard" method="post">

        <input type="text"
               id="uname"
               name="uname"
               class="form-control mb-3"
               placeholder="Username"
               required>

        <input type="password"
               id="pass"
               name="upass"
               class="form-control mb-3"
               placeholder="Password"
               required>

        <div class="form-check mb-3">

            <input type="checkbox"
                   class="form-check-input">

            <label class="form-check-label">
                Remember Me
            </label>

        </div>

        <button class="btn btn-login btn-lg btn-block"
                type="submit">

            Sign In
        

        </button>

    </form>

    <div class="footer-text">
        © {{ params['blog_name'] }} 2026
    </div>

</div>
```

</body>

</html>
